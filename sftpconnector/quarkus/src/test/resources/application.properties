# What a host writes to get a connector. The server's address, the credential and the staging
# directory are supplied by EmbeddedSftpServerResource, because the port is chosen by the
# operating system when the test's server starts.
sftp.connector.name=vendor-drop
# The embedded server generates a fresh key per run, so there is no key a test could have
# recorded in advance. A deployment writes STRICT and a known-hosts file.
sftp.connector.host-key.policy=ACCEPT_ALL

sftp.connector.polling.directories=/drop
sftp.connector.polling.on-ack.kind=MOVE
sftp.connector.polling.on-ack.target=done/
# The one readiness check with no clock in it: the file is ready when its uploader says so.
# Naming it replaces the connector's default heuristic rather than adding to it.
sftp.connector.polling.readiness.marker-file=.ready

# Deliberately not the default, so the test can tell a value that was read from one that was
# assumed. Written in the relaxed form a host accepts rather than in ISO-8601.
sftp.connector.pool.max-size=2
sftp.connector.pool.drain-timeout=10s

quarkus.log.category."sftp.connector".level=DEBUG
