# The worked shape-D task (SimpleEtl spec 2.4): cacheCopy out of a generation into scratch,
# materialize over it, pipe out. Promoted from the test fixture by the P9 operator round's
# finding: 'copying from it is its intended use' sent readers to a module whose only worked
# YAML lived inside test code. Point etl-host.etl.task-directory at a directory shaped like
# this one - docker-compose.staging.yml mounts this very directory.
#
# It was promoted verbatim, which turned out to mean promoted WITH the Kotlin string template
# it was written as: `$TASK`, `$GROUP` and the leading indentation of a trimIndent() literal.
# A file in that state does not validate, and the host fails its boot naming it - loudly, which
# is the good failure mode, but it made the one file that exists to be copied uncopyable. This
# is the same task with the templates resolved.
name: wip-summary
schedule:
  # Hourly, on the hour. Quarkus's parser, so a six-field expression with a seconds column.
  cron: "0 0 * * * ?"
phases:
  - name: load
    steps:
      # `cache` names a binding the host owns: etl-host.cache.sql's keys ARE the group list,
      # and the table inside a generation takes the group's name.
      - name: copy-wip
        type: cacheCopy
        cache: wip
        sql: select id, lot_id, qty, site from wip
        output: wip_cache
      - name: summarise
        type: materialize
        datasource: scratch
        output: summary
        sql: select site, count(*) as lots, sum(qty) as total_qty from wip_cache group by site
      # `wip_summary` must already exist in the `report` datasource - staging/init-oracle.sh
      # creates it. The target is a MERGE statement, not a table: a plain table target appends
      # a fresh copy of the whole summary on every firing, which the 93-minute soak measured
      # growing without bound (744 rows and climbing, linear in run count). A statement target
      # replaces per key instead, and `idempotent: true` is the author's promise that a rerun
      # converges - which is also what lets this step ever be retried.
      - name: publish
        type: pipe
        source:
          datasource: scratch
          sql: select site, lots, total_qty from summary
        target:
          datasource: report
          sql: >-
            merge into wip_summary t
            using (select :site as site, :lots as lots, :total_qty as total_qty from dual) s
            on (t.site = s.site)
            when matched then update set t.lots = s.lots, t.total_qty = s.total_qty
            when not matched then insert (site, lots, total_qty) values (s.site, s.lots, s.total_qty)
          idempotent: true
