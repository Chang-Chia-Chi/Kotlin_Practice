# =====================================================================================
# etl-host - the reference host's configuration.
#
# Every number below is A value that boots and passes a suite. NONE of them is a
# recommendation: the operating point - how many tasks overlap, at what memory limits,
# in what pod - is a statement about a memory request, a page cache and a real
# schedule, and no test in this reactor is evidence about it. See README.md.
#
# Two settings are load-bearing wherever they appear, and both are named in a spec
# because missing them fails silently rather than loudly.
# =====================================================================================

# ---- (1) THE ONE PROPERTY WITHOUT WHICH NOTHING FIRES -------------------------------
# SimpleEtl spec 8.6, row 1. Symptom if missed: no task ever fires, and no error is
# raised. It has to live in the APPLICATION's application.properties - Quarkus does not
# read one out of a dependency jar, which is why SimpleEtl declines to ship it and why
# this line is the reason this module exists at all.
quarkus.scheduler.start-mode=forced

# ---- (2) THE ONE FLAG NO TEST CAN CHECK ---------------------------------------------
# SimpleEtl spec 8.6 (last-but-one row) and snapshotcache spec 5.4. A deployment must
# run the JVM with:
#
#     -Dkotlinx.coroutines.debug=on
#
# Without it, LeaseInfo.owner is the acquiring thread's name - and every run acquires on
# Dispatchers.IO.limitedParallelism(1), a view over the shared IO pool with no
# ThreadFactory to name. The cache's expired-lease WARN and its liveGenerations then both
# read "DefaultDispatcher-worker-1" and name no task, so "which job is stalling refresh"
# is unanswerable in exactly the incident the diagnostics exist for.
#
# NO TEST CAN CATCH ITS ABSENCE. kotlinx-coroutines' debug mode is AUTO and turns itself
# on whenever assertions are enabled, and surefire enables them - so every test JVM in
# this repository shows attribution working while a production JVM silently has none.
# Verify by reading a running pod's command line, not by a green suite. Measured on
# composed-host-example: under 10 us and under 3% of a task run, so there is no cost
# argument against setting it unconditionally.
#
# Set in etl-host/pom.xml's surefire argLine as well, so the suite runs production's
# shape - which is a statement about consistency and not about coverage.
#
# There is no property for it. A JVM flag cannot be set from application.properties, which is
# exactly why this section is a comment with nothing under it - and why the line below belongs
# to the next heading, not to this one.

# ---- logging ------------------------------------------------------------------------
# LoggingRunListener's category (spec 9.2). INFO gives task start/end and one line per step;
# DEBUG adds phase and step starts. The frameworks log through org.jboss.logging, so
# quarkus.log.* configures them and this together.
quarkus.log.category."etl.run".level=INFO

# ---- snapshot cache (snapshotcache spec 13) -----------------------------------------
etl-host.cache.storage-path=${java.io.tmpdir}/etl-host/cache
etl-host.cache.temp-directory=${java.io.tmpdir}/etl-host/tmp
# The groups this host serves, and the SQL behind each. The map's keys ARE the group
# list - there is no second setting to disagree with it, and the table inside a
# generation takes the group's name.
#
# Each statement MUST project an `id` column: VerifyConfig.keyUnique defaults to true and
# the gate runs COUNT(id), COUNT(DISTINCT id) over every table of a candidate. A group
# without one fails its first refresh and the symptom surfaces two systems away, as a
# failed cacheCopy step with the real cause in the cache's verify log.
etl-host.cache.sql.wip=select id, lot_id, qty, site from lot
# A second group, and adding one really is this line. The map's keys are the group list, so this
# also creates the group's own store directory (spec 5.4 derives it), its CacheBinding, and the
# cache name a task file may reference - there is no second place to add it and no second place to
# forget it. What it does NOT create is the source table behind it or the task file that reads it.
etl-host.cache.sql.equipment=select id, tool_id, state from equipment
etl-host.cache.serving-memory-limit=1GB
# Gap measured from the end of the previous round, not a cron (spec 4.4).
etl-host.cache.refresh-interval=PT10M
# 3.6: this is spent ONCE by a cacheCopy step with no generation available, and the step
# type forbids retries. A task whose cron lands inside the startup window pins its
# dispatcher for the whole budget and then fails with TIMEOUT - not NOT_READY, which only
# a zero budget produces. The remedy is the readiness gate above, not a task-level retry.
etl-host.cache.wait-budget=PT30S
# Diagnostic only. Nothing is ever force-reclaimed when it passes (spec 6.2, D8).
etl-host.cache.lease-deadline=PT5M
# terminationGracePeriodSeconds must exceed this plus headroom - 45-60s for this value
# (snapshotcache spec 11.3). Below it, Kubernetes SIGKILLs mid-drain and the whole
# shutdown design has no effect.
etl-host.cache.lease-drain-timeout=PT30S

# ---- the source behind every group --------------------------------------------------
etl-host.source.url=jdbc:duckdb:${java.io.tmpdir}/etl-host/source.db
etl-host.source.username=
etl-host.source.password=
# SimpleEtl spec 8.6: the framework has no timeout anywhere and that is the design -
# TaskEngine.run is a blocking call with no Statement handle to cancel. Without a
# host-side timeout a wedged driver parks that task's dispatcher permanently, the task
# reads busy forever, and every later firing is skipped as AlreadyRunning in silence.
# Surfaces as SQLTimeoutException, which spec 5.3 classes transient, so it retries.
etl-host.source.query-timeout-seconds=300
etl-host.source.fetch-size=2000

# ---- SimpleEtl (spec 11.2) ----------------------------------------------------------
etl-host.etl.task-directory=${java.io.tmpdir}/etl-host/tasks
etl-host.etl.scratch-directory=${java.io.tmpdir}/etl-host/scratch
# The pod budget is N x this + serving-memory-limit (D16). composed-host-example's M2
# measured both premises and one surprise: shrinking this does not shrink the run, it
# converts RAM into spill bytes at a poor rate - 192 MB saved cost 3 GB of extra spill on
# one query - against a term the formula does not contain.
etl-host.etl.scratch-memory-limit-mb=1024
etl-host.etl.target-url=jdbc:duckdb:${java.io.tmpdir}/etl-host/report.db
etl-host.etl.target-name=report

# ---- HTTP -----------------------------------------------------------------------------
quarkus.http.port=8080
