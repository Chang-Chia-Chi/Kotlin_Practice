# Shuttle host (spec 12 and 14). Every value here is one a deployment overrides through the environment.

# The YAML files the host loads, comma-separated; later files complete earlier ones (spec 13.1).
shuttle.config=${SHUTTLE_CONFIG:/etc/shuttle/shuttle.yaml}
# `serve` runs the routes. `ShuttleMain` sets `validate` or `try` from the command line, and the host then never starts.
shuttle.mode=serve

# The state store: `shuttleStateStore.oracle.datasource` in the YAML names a Quarkus datasource; this is the one
# the spec 13.1 document names. The DBA applies StateStoreSchema.DDL (D15); the host only reads it.
quarkus.datasource.shuttle.db-kind=oracle
quarkus.datasource.shuttle.jdbc.url=${SHUTTLE_DB_URL:}
quarkus.datasource.shuttle.username=${SHUTTLE_DB_USER:}
quarkus.datasource.shuttle.password=${SHUTTLE_DB_PASSWORD:}

quarkus.http.port=8080

# Spec 14.1: the admin endpoints are under the `shuttle-admin` role. `quarkus-security` checks the role; this
# block is the smallest real identity provider, exactly as etl-host explains. Replace it with the deployment's
# mechanism; do not remove it, or every admin call answers 403 for ever.
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.shuttle-admin=${SHUTTLE_ADMIN_PASSWORD:placeholder-change-me}
quarkus.security.users.embedded.roles.shuttle-admin=shuttle-admin
quarkus.http.auth.basic=true
# A kubelet carries no credential: readiness and the scrape stay open.
quarkus.http.auth.permission.probes.paths=/q/health,/q/health/*,/q/metrics
quarkus.http.auth.permission.probes.policy=permit
