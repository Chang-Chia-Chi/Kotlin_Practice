# The test tree's half of one property, and nothing else: `quarkus.security.users.embedded.users.shuttle-admin`
# in the main application.properties expands ${SHUTTLE_ADMIN_PASSWORD} with no default, so an unset variable ends
# the boot (SRCFG00011) rather than starting with a known credential. That refusal is the point of the missing
# default, and a test JVM still has to boot.
#
# THIS IS NOT A CREDENTIAL. No test authenticates with it - every security assertion in the module carries
# @TestSecurity, which synthesises an identity and never reaches the provider - so the value only has to exist.
SHUTTLE_ADMIN_PASSWORD=test-only-not-a-credential
