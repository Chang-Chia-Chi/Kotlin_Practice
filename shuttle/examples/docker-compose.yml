# The local stack the quickstart in ../README.md drives: an SFTP server to drop files on, MinIO to store them
# in, Oracle for the transfer ledger, and an HTTP echo endpoint to receive the callback.
#
# EVERY CREDENTIAL BELOW IS A THROWAWAY LOCAL VALUE. It exists so one laptop can run the walkthrough; nothing
# here is a secret and nothing here belongs in a deployment.
#
#   docker compose -f shuttle/examples/docker-compose.yml up -d
#   docker compose -f shuttle/examples/docker-compose.yml down -v

name: shuttle-example

services:

  # The vendor's SFTP server. The user is chrooted to /home/vendor, so shuttle sees /drop, /drop/temp
  # (the `onAck: { move: temp/ }` target) and /outbound (the mirror route's directory).
  sftp:
    image: atmoz/sftp:alpine
    container_name: shuttle-example-sftp
    command: "vendor:vendor-pw:1001::drop,drop/temp,outbound"
    ports: [ "2222:22" ]

  # The object store. Versioning is on because the S3 target's crash repair reads the newest version by key.
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: shuttle-example-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: [ "9000:9000", "9001:9001" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # Creates the `landing` bucket with versioning on, then stays alive as the MinIO command line:
  #   docker exec shuttle-example-mc mc ls --recursive --versions local/landing
  mc:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: shuttle-example-mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/landing &&
             mc version enable local/landing &&
             exec tail -f /dev/null"

  # The transfer ledger. `schema.sql` is spec 8.1's DDL verbatim (StateStoreSchemaTest keeps it that way);
  # gvenzl's entrypoint runs everything in initdb.d once, at first start, and oracle-init.sh applies the DDL
  # as the user shuttle connects as. `down -v` throws the database away, so the next `up` applies it again.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: shuttle-example-oracle
    environment:
      ORACLE_PASSWORD: oracle-pw
      APP_USER: shuttle
      APP_USER_PASSWORD: shuttle-pw
    ports: [ "1521:1521" ]
    volumes:
      - ./schema.sql:/schema/schema.sql:ro
      - ./oracle-init.sh:/container-entrypoint-initdb.d/01-schema.sh:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Stands in for the downstream API: answers 200 and prints the whole request, body included, to its log.
  echo:
    image: mendhak/http-https-echo:31
    container_name: shuttle-example-echo
    environment:
      HTTP_PORT: "8081"
    ports: [ "8081:8081" ]
