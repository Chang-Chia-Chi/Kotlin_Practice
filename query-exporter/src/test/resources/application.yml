quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
  scheduler:
    enabled: false
  micrometer:
    export:
      prometheus:
        enabled: false

# Minimal exporter config for tests that need it
exporter:
  queries:
    test_query:
      sql: "SELECT 1 as value"
      datasource: default
      schedule:
        interval: "60s"
      metrics:
        - name: test_metric
          type: GAUGE
          value-column: value
