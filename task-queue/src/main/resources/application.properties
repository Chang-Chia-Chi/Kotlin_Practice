# ─────────────────────── Leader Election ───────────────────────
leader.election.lease-name=app-leader
leader.election.namespace=default
leader.election.lease-duration-seconds=15
leader.election.renew-deadline-seconds=10
leader.election.retry-period-seconds=2

# ─────────────────────── Consumer ───────────────────────
task.consumer.poll-interval=5s
task.consumer.batch-size=50
task.consumer.concurrency=10
task.consumer.shutdown-timeout-seconds=25

# ─────────────────────── Housekeeping ───────────────────────
# Stale reclaimer: reset PROCESSING tasks older than this
task.reclaim.stale-minutes=5
task.reclaim.interval=2m

# Scheduled task promoter: promote RETRYABLE/SCHEDULED → PENDING
task.promote.interval=5s

# Deadline expirer: mark PENDING tasks past deadline as EXPIRED
task.expiry.interval=10m

# Purge: DELETE terminal tasks older than retention
task.cleanup.retention-days=7
task.cleanup.cron=0 0 2 * * ?

# ─────────────────────── Task Production (example) ───────────────────────
# Add your own cron expressions for task production triggers
task.produce.cron=0 */15 * * * ?

# ─────────────────────── DataSource (Oracle) ───────────────────────
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
quarkus.datasource.username=taskqueue
quarkus.datasource.password=changeme
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
