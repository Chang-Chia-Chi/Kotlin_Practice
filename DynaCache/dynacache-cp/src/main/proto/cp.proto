syntax = "proto3";

package dynacache.cp.proto;

option java_package = "dynacache.cp.proto";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// RaftService: MicroRaft's inter-member traffic (CP spec 2.4).
// ---------------------------------------------------------------------------

// Every MicroRaft message carries a group, a sender and a term; the oneof is the rest of it.
// A per-message mapping, not a bytes blob, so a wire dump reads as Raft rather than as base64.
// The one place bytes survives is a log entry's operation, which is a `Command.Cp` (or one of
// MicroRaft's own internal no-ops) and belongs to the engine, not to Raft.
message RaftEnvelope {
  string group_id = 1;
  string sender = 2;
  int32 term = 3;
  oneof body {
    Candidacy pre_vote_request = 10;
    Granted pre_vote_response = 11;
    Candidacy vote_request = 12;
    Granted vote_response = 13;
    AppendEntriesRequest append_entries_request = 14;
    AppendEntriesSuccess append_entries_success = 15;
    AppendEntriesFailure append_entries_failure = 16;
    Candidacy trigger_leader_election = 17;
    InstallSnapshotRequest install_snapshot_request = 18;
    InstallSnapshotResponse install_snapshot_response = 19;
  }
}

// A member offering itself as leader: pre-vote, vote and the leadership-transfer trigger all
// name the same thing, the tip of the candidate's log. `sticky` is only read on a vote request.
message Candidacy {
  int32 last_log_term = 1;
  int64 last_log_index = 2;
  bool sticky = 3;
}

message Granted {
  bool granted = 1;
}

message AppendEntriesRequest {
  int32 previous_log_term = 1;
  int64 previous_log_index = 2;
  int64 commit_index = 3;
  int64 query_sequence_number = 4;
  int64 flow_control_sequence_number = 5;
  repeated LogEntry entries = 6;
}

message LogEntry {
  int64 index = 1;
  int32 term = 2;
  // The replicated operation, in the hand encoding of `CpWire`.
  bytes operation = 3;
}

message AppendEntriesSuccess {
  int64 last_log_index = 1;
  int64 query_sequence_number = 2;
  int64 flow_control_sequence_number = 3;
}

message AppendEntriesFailure {
  int64 expected_next_index = 1;
  int64 query_sequence_number = 2;
  int64 flow_control_sequence_number = 3;
}

// The group as a snapshot, or a member's store, remembers it (fixed at startup, CP spec 2.2).
message GroupMembersView {
  int64 log_index = 1;
  repeated string members = 2;
  repeated string voting_members = 3;
}

// One chunk of a state machine snapshot; `operation` is the chunk in the hand encoding of `CpWire`.
message SnapshotChunk {
  int64 index = 1;
  int32 term = 2;
  bytes operation = 3;
  int32 chunk_index = 4;
  int32 chunk_count = 5;
  GroupMembersView members = 6;
}

// A chunk offered to a member that fell behind the log's tail (CP spec 10.7, I20). The first
// request of an install carries no chunk: it announces the snapshot and asks which chunks the
// member wants, and the response names one.
message InstallSnapshotRequest {
  bool sender_leader = 1;
  int32 snapshot_term = 2;
  int64 snapshot_index = 3;
  int32 total_chunk_count = 4;
  SnapshotChunk chunk = 5;
  repeated string snapshotted_members = 6;
  GroupMembersView members = 7;
  int64 query_sequence_number = 8;
  int64 flow_control_sequence_number = 9;
}

message InstallSnapshotResponse {
  int64 snapshot_index = 1;
  int32 requested_chunk_index = 2;
  int64 query_sequence_number = 3;
  int64 flow_control_sequence_number = 4;
}

// What a member's store keeps besides its log and snapshot: who it is, the group it started with,
// and the term and vote Raft must not forget across a restart.
message MemberState {
  string endpoint = 1;
  bool voting = 2;
  GroupMembersView initial_members = 3;
  int32 term = 4;
  string voted_for = 5;
}

// Handle's acknowledgement: a Raft message carries no reply of its own, the answer is another
// message. Mirrors the cluster's `Delivered` (T23).
message Accepted {}

service RaftService {
  rpc Handle(RaftEnvelope) returns (Accepted);
}

// ---------------------------------------------------------------------------
// CpService: what a node asks the CP members for (CP spec 2.4).
// ---------------------------------------------------------------------------

// A `Command.Cp` and the `Reply` it produced, both in the hand encoding of `CpWire`. Protobuf
// messages for the command hierarchy would have to be re-cut every time a ticket adds a verb;
// the encoding is one `when` in one file instead.
message CpRequest {
  bytes command = 1;
}

message CpReply {
  bytes reply = 1;
}

message InfoRequest {}

// `CP.INFO` (CP spec 6.7). `leader` is empty when the member knows of none.
message CpInfo {
  string leader = 1;
  repeated string members = 2;
  int64 log_size = 3;
  int64 applied_index = 4;
  int64 snapshot_index = 5;
}

message HeartbeatRequest {
  string session_id = 1;
}

message HeartbeatReply {
  bool ok = 1;
}

service CpService {
  rpc Apply(CpRequest) returns (CpReply);
  rpc GetInfo(InfoRequest) returns (CpInfo);
  // Session keepalive: ok when this member's engine applied it (CP spec 6.6).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}
