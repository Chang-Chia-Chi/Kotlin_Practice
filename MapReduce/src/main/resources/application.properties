# Datasource (Oracle)
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
quarkus.datasource.username=${ORACLE_USERNAME:mapreduce}
quarkus.datasource.password=${ORACLE_PASSWORD:mapreduce}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=15

# Flyway
quarkus.flyway.migrate-at-start=true

# Map-Reduce Framework
mapreduce.worker.poll-interval=2S
mapreduce.worker.bulkhead-size=4
mapreduce.worker.stale-threshold=5M
mapreduce.worker.id=${HOSTNAME:local-worker}
mapreduce.worker.queues=default,mr,dag
mapreduce.leader.monitor-interval=3S

# Heartbeat & Stale Task Reaper
mapreduce.heartbeat.interval=30S
mapreduce.reaper.scan-interval=30S
mapreduce.reaper.stale-threshold=90S
mapreduce.reaper.batch-size=50

# Fault Tolerance
mapreduce.worker.circuit-breaker-threshold=10
mapreduce.speculative.enabled=true
mapreduce.speculative.median-multiplier=3.0
mapreduce.speculative.min-completed=5

# Leader Election (fenced)
mapreduce.leader-election.lease-name=mapreduce-leader
mapreduce.leader-election.namespace=${KUBERNETES_NAMESPACE:default}
mapreduce.leader-election.lease-duration=15S
mapreduce.leader-election.renew-deadline=10S
mapreduce.leader-election.retry-period=2S

# Graceful shutdown (must align with K8s terminationGracePeriodSeconds = 90s)
quarkus.shutdown.timeout=85S
mapreduce.shutdown.drain-timeout=60S
mapreduce.shutdown.leader-teardown-timeout=5S
mapreduce.shutdown.release-timeout=5S
mapreduce.shutdown.log-interval=5S

# Autoscaling Metrics
mapreduce.metrics.queue-depth-interval=15S

# Dead Letter Processor
mapreduce.dead-letter.retention-days=30
mapreduce.dead-letter.cleanup-schedule-hours=24
mapreduce.dead-letter.archive-before-delete=false
mapreduce.dead-letter.alert-default-threshold=10
mapreduce.dead-letter.alert-default-window=5M
mapreduce.dead-letter.slack-webhook-url=${DEAD_LETTER_SLACK_WEBHOOK:}

# Cron Schedule Trigger
mapreduce.schedule.trigger-interval=10S

# Health Probe Registry
mapreduce.health.oracle-check-timeout=5S
mapreduce.health.worker-loop-stale-threshold=6S
mapreduce.health.detail-endpoint-enabled=true
mapreduce.health.leader-readiness-enabled=false

# Kubernetes client (disabled in dev)
quarkus.kubernetes-client.devservices.enabled=false

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."com.mapreduce".level=INFO

# Query Exporter — configure queries in application.yaml or properties
# query-exporter.cardinality-limit=1000
# query-exporter.io-parallelism=8
# See ExporterConfig for full YAML schema
