# Datasource (Oracle)
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
quarkus.datasource.username=${ORACLE_USERNAME:mapreduce}
quarkus.datasource.password=${ORACLE_PASSWORD:mapreduce}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# Flyway
quarkus.flyway.migrate-at-start=true

# Map-Reduce Framework
mapreduce.worker.poll-interval=2S
mapreduce.worker.bulkhead-size=4
mapreduce.worker.stale-threshold=5M
mapreduce.worker.id=${HOSTNAME:local-worker}
mapreduce.worker.queues=default,mr
mapreduce.leader.monitor-interval=3S

# Kubernetes client (disabled in dev)
quarkus.kubernetes-client.devservices.enabled=false

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."com.mapreduce".level=DEBUG
