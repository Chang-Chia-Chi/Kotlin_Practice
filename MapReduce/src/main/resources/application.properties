# Datasource (Oracle)
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
quarkus.datasource.username=${ORACLE_USERNAME:mapreduce}
quarkus.datasource.password=${ORACLE_PASSWORD:mapreduce}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=15

# Flyway
quarkus.flyway.migrate-at-start=true

# Task Queue Framework
taskqueue.worker.poll-interval=2S
taskqueue.worker.bulkhead-size=4
taskqueue.worker.id=${HOSTNAME:local-worker}
taskqueue.worker.queues=default,mr
taskqueue.leader.monitor-interval=3S

# Stale Task Reaper (must exceed pipeline timeout)
taskqueue.reaper.scan-interval=30S
taskqueue.reaper.stale-threshold=5M
taskqueue.reaper.batch-size=50

# Fault Tolerance
taskqueue.worker.circuit-breaker-threshold=10

# Leader Election (fenced)
taskqueue.leader-election.lease-name=taskqueue-leader
taskqueue.leader-election.namespace=${KUBERNETES_NAMESPACE:default}
taskqueue.leader-election.lease-duration=15S
taskqueue.leader-election.renew-deadline=10S
taskqueue.leader-election.retry-period=2S

# Graceful shutdown (must align with K8s terminationGracePeriodSeconds = 90s)
quarkus.shutdown.timeout=85S
taskqueue.shutdown.drain-timeout=60S
taskqueue.shutdown.leader-teardown-timeout=5S
taskqueue.shutdown.release-timeout=5S
taskqueue.shutdown.log-interval=5S

# Health Probe Registry
taskqueue.health.oracle-check-timeout=5S
taskqueue.health.worker-loop-stale-threshold=6S
taskqueue.health.leader-readiness-enabled=false

# Kubernetes client (disabled in dev)
quarkus.kubernetes-client.devservices.enabled=false

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."com.mapreduce".level=INFO
