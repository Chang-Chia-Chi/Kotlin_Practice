# Test datasource — H2 in-memory, Oracle compatibility mode
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Disable Flyway (we manage schema in tests)
quarkus.flyway.migrate-at-start=false

# Framework config for tests
mapreduce.worker.poll-interval=100ms
mapreduce.worker.bulkhead-size=2
mapreduce.worker.id=test-worker
mapreduce.worker.queues=default,mr
mapreduce.worker.circuit-breaker-threshold=5
mapreduce.leader.monitor-interval=100ms
mapreduce.heartbeat.interval=1S
mapreduce.reaper.scan-interval=1S
mapreduce.reaper.stale-threshold=3S
mapreduce.reaper.batch-size=50
mapreduce.leader-election.lease-name=test-leader
mapreduce.leader-election.namespace=default
mapreduce.leader-election.lease-duration=15S
mapreduce.leader-election.renew-deadline=10S
mapreduce.leader-election.retry-period=2S
mapreduce.shutdown.drain-timeout=5S
mapreduce.shutdown.leader-teardown-timeout=1S
mapreduce.shutdown.release-timeout=1S
mapreduce.shutdown.log-interval=1S
mapreduce.metrics.queue-depth-interval=1S
mapreduce.dead-letter.retention-days=30
mapreduce.dead-letter.cleanup-schedule-hours=24
mapreduce.dead-letter.archive-before-delete=false
mapreduce.dead-letter.alert-default-threshold=3
mapreduce.dead-letter.alert-default-window=60S
mapreduce.dead-letter.slack-webhook-url=
mapreduce.health.oracle-check-timeout=5S
mapreduce.health.worker-loop-stale-threshold=6S
mapreduce.health.detail-endpoint-enabled=true
mapreduce.health.leader-readiness-enabled=false
mapreduce.pipeline.default-timeout=30S

# Disable K8s client in tests
quarkus.kubernetes-client.devservices.enabled=false
