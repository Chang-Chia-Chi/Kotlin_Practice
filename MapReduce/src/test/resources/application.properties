# Test datasource — H2 in-memory, Oracle compatibility mode
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Disable Flyway (we manage schema in tests)
quarkus.flyway.migrate-at-start=false

# Framework config for tests
taskqueue.worker.poll-interval=100ms
taskqueue.worker.bulkhead-size=2
taskqueue.worker.id=test-worker
taskqueue.worker.queues=default,mr
taskqueue.leader.monitor-interval=100ms
taskqueue.reaper.scan-interval=1S
taskqueue.reaper.stale-threshold=5S
taskqueue.reaper.batch-size=50
taskqueue.leader-election.lease-name=test-leader
taskqueue.leader-election.namespace=default
taskqueue.leader-election.lease-duration=15S
taskqueue.leader-election.renew-deadline=10S
taskqueue.leader-election.retry-period=2S
taskqueue.shutdown.drain-timeout=5S
taskqueue.shutdown.leader-teardown-timeout=1S
taskqueue.shutdown.log-interval=1S
taskqueue.health.oracle-check-timeout=5S
taskqueue.health.worker-loop-stale-threshold=6S
taskqueue.health.leader-readiness-enabled=false
taskqueue.pipeline.default-timeout=30S

# Disable K8s client in tests
quarkus.kubernetes-client.devservices.enabled=false
