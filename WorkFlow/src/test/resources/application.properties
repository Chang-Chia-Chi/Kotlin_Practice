# Test datasource -- H2 in Oracle compatibility mode (per CLAUDE.md constraint 5)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Disable Flyway for tests -- no migrations exist yet
quarkus.flyway.enabled=false

# Disable Kubernetes client -- not available in test
quarkus.kubernetes-client.api-server-url=https://localhost:0
quarkus.kubernetes-client.trust-certs=true
