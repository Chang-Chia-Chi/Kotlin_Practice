# Test datasource -- Oracle Free via Testcontainers (per CLAUDE.md constraint 5)
quarkus.datasource.db-kind=oracle
quarkus.datasource.devservices.enabled=false

# Disable Flyway for tests -- schema managed by OracleTestContainer
quarkus.flyway.enabled=false

# Keep plaintext logs for test readability
quarkus.log.console.json=false

framework.trigger.sweep-interval=PT5S
framework.trigger.sql-max-concurrent=2

# Storage (MinIO via Testcontainer — endpoint overridden by QuarkusTestResource)
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.bucket=dispatch-test
storage.access-key=minioadmin
storage.secret-key=minioadmin

# Dispatch
dispatch.env=prod

# Faster polling for E2E tests
framework.worker.poll-interval=PT0.2S
framework.worker.fallback-poll-interval=PT0.5S
framework.worker.concurrency=4
framework.worker.max-batch-size=16
framework.worker.auto-start=false
framework.trigger.auto-start=false
