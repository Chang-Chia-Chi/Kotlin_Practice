# =============================================================================
# Datasource (Oracle - production)
# =============================================================================
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_NAME:XEPDB1}
quarkus.datasource.username=${DB_USER:workflow}
quarkus.datasource.password=${DB_PASSWORD:workflow}

# =============================================================================
# Flyway
# =============================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# =============================================================================
# Framework Config
# =============================================================================
framework.worker.id=${HOSTNAME:localhost}
framework.worker.poll-interval=PT1S
framework.worker.fallback-poll-interval=PT5S
framework.worker.max-batch-size=16
framework.worker.concurrency=4
framework.worker.pod-ip=${POD_IP:localhost}
framework.worker.service-name=workflow-engine

framework.leader-election.namespace=default
framework.leader-election.lease-name=workflow-leader
framework.leader-election.lease-duration=PT15S
framework.leader-election.renew-deadline=PT10S
framework.leader-election.retry-period=PT2S

framework.trigger.sweep-interval=PT5S
framework.trigger.sql-max-concurrent=5

framework.shutdown.global-timeout=PT30S
framework.shutdown.leader-teardown-timeout=PT10S

framework.watchdog.interval=PT30S
framework.watchdog.grace-period=PT2M

# =============================================================================
# CDI
# =============================================================================
quarkus.arc.remove-unused-beans=none

# =============================================================================
# Logging
# =============================================================================
quarkus.log.console.json=true
quarkus.log.console.json.additional-field.service.value=workflow-engine

# =============================================================================
# Storage (MinIO/S3)
# =============================================================================
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.region=${STORAGE_REGION:us-east-1}
storage.bucket=${STORAGE_BUCKET:dispatch}
storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}

# =============================================================================
# Dispatch Scheduling
# =============================================================================
dispatch.cron=${DISPATCH_CRON:0 0 0,6,12,18 * * ?}

# =============================================================================
# Dispatch Environment
# =============================================================================
dispatch.env=${DISPATCH_ENV:prod}
dispatch.k8s.namespace=${DISPATCH_K8S_NAMESPACE:default}
