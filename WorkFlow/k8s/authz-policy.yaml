apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: workflow-engine-internal
  namespace: default
spec:
  selector:
    matchLabels:
      app: workflow-engine
  action: ALLOW
  rules:
    # /internal/* — only callable by pods running as the same ServiceAccount
    - from:
        - source:
            principals:
              - "cluster.local/ns/default/sa/workflow-engine"
      to:
        - operation:
            paths: ["/internal/*"]
    # all other paths — no source restriction
    - to:
        - operation:
            notPaths: ["/internal/*"]
